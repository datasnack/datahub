name: Create and publish a Docker image

# No caching in release builds: prevents cache poisoning from less-trusted runs (e.g. PRs)
cache-mode: none

# Runs every time a tag starting with "v" is pushed (e.g. v1.2.3).
on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Upload built assets
        uses: actions/upload-artifact@v6.0.0
        with:
          name: css-js-artifacts
          path: src/datahub/app/static/build

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: build-frontend
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Download frontend artifact
        uses: actions/download-artifact@v7.0.0
        with:
          name: css-js-artifacts
          path: src/datahub/app/static/build

      - name: Log in to the Container registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Only tag pushes trigger this workflow, so branch/PR tags never apply.
          # "latest" is added automatically for non-prerelease semver tags.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Signs a statement "this digest was built by this workflow run, from this commit"
      # and stores it with GitHub (and, with push-to-registry, next to the image in GHCR).
      - name: Generate artifact attestation
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
