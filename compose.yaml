services:
  datahub:
    build: .
    env_file:
      - .env
    ports:
      - ${DATAHUB_PORT:-8000}:8000
    volumes:
      - ./:/app/
      - ./data:/app/data/
      - ./src:/app/src/
      - ./docs:/app/docs/

  postgis:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${DB_NAME:-datasnack}
      POSTGRES_USER: ${DB_USER:-datasnack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-datasnack}
    ports:
      - 5432:5432
    volumes:
      - postgis:/var/lib/postgresql/

volumes:
  postgis:
